<svg xmlns="http://www.w3.org/2000/svg" width="760" height="981" viewBox="0 0 760 981"><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#546579"/></marker></defs><text x="30" y="32" font-family="Arial" font-size="22" font-weight="bold" fill="#172b45">Troubleshooting: badge does not open door</text><path d="M165.0,180 L165.0,230" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><path d="M290,275.0 L470,275.0" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="380.0" y="268.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">No</text><path d="M165.0,320 L165.0,370" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="165.0" y="338.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">Yes</text><path d="M290,415.0 L470,415.0" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="380.0" y="408.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">No</text><path d="M165.0,460 L165.0,510" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="165.0" y="478.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">Yes</text><path d="M290,555.0 L470,555.0" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="380.0" y="548.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">No / unknown</text><path d="M165.0,600 L165.0,650" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="165.0" y="618.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">Yes</text><path d="M165.0,740 L165.0,790" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="90" width="250" height="90" rx="10" fill="#eaf2ff" stroke="#5077a8"/><text x="165.0" y="125.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Identify door and scan time</text><text x="165.0" y="145.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Use known authorized ID</text><polygon points="165.0,230 290,275.0 165.0,320 40,275.0" fill="#fff5d6" stroke="#ab8227"/><text x="165.0" y="265.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Manual FOM</text><text x="165.0" y="285.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">control works?</text><rect x="470" y="230" width="250" height="90" rx="10" fill="#fff5d6" stroke="#ab8227"/><text x="595.0" y="255.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Check correct relay IP/outlet</text><text x="595.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Power, network, physical</text><text x="595.0" y="295.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">output</text><polygon points="165.0,370 290,415.0 165.0,460 40,415.0" fill="#fff5d6" stroke="#ab8227"/><text x="165.0" y="415.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Power and link OK?</text><rect x="470" y="370" width="250" height="90" rx="10" fill="#fff5d6" stroke="#ab8227"/><text x="595.0" y="395.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Check power, USB and Ethernet</text><text x="595.0" y="415.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">LED activity ≠ server</text><text x="595.0" y="435.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">reachability</text><polygon points="165.0,510 290,555.0 165.0,600 40,555.0" fill="#fff5d6" stroke="#ab8227"/><text x="165.0" y="555.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Scan reaches FOM?</text><rect x="470" y="510" width="250" height="90" rx="10" fill="#fff5d6" stroke="#ab8227"/><text x="595.0" y="535.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Check EasyLog/network path</text><text x="595.0" y="555.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Record screen errors for</text><text x="595.0" y="575.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">support</text><rect x="40" y="650" width="250" height="90" rx="10" fill="#eaf2ff" stroke="#5077a8"/><text x="165.0" y="685.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Review access denial</text><text x="165.0" y="705.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">and resource configuration</text><rect x="40" y="790" width="250" height="90" rx="10" fill="#e8f5ed" stroke="#39815b"/><text x="165.0" y="825.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Retest and record outcome</text><text x="165.0" y="845.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Escalate unresolved fault</text><text x="30" y="915" font-family="Arial" font-size="13" fill="#536273">After each correction, repeat the original test. Do not change permissions merely to bypass a</text><text x="30" y="933" font-family="Arial" font-size="13" fill="#536273">denial.</text></svg>