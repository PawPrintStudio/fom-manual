<svg xmlns="http://www.w3.org/2000/svg" width="760" height="841" viewBox="0 0 760 841"><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#546579"/></marker></defs><text x="30" y="32" font-family="Arial" font-size="22" font-weight="bold" fill="#172b45">Badge scan and feedback</text><path d="M165.0,180 L165.0,230" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="165.0" y="198.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">USB</text><path d="M165.0,320 L165.0,370" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="165.0" y="338.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">Network</text><path d="M165.0,460 L165.0,510" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="165.0" y="478.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">Decision</text><path d="M165.0,600 L165.0,650" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="165.0" y="618.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">Yes</text><path d="M290,555.0 L470,555.0" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="380.0" y="548.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">No</text><path d="M165.0,600 L165.0,625.0 L595.0,625.0 L595.0,650" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="380.0" y="618.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">Yes: feedback*</text><rect x="40" y="90" width="250" height="90" rx="10" fill="#eaf2ff" stroke="#5077a8"/><text x="165.0" y="135.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Tap ID at reader</text><rect x="40" y="230" width="250" height="90" rx="10" fill="#eaf2ff" stroke="#5077a8"/><text x="165.0" y="265.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">EasyLog submits ID</text><text x="165.0" y="285.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">to FOM over network</text><rect x="40" y="370" width="250" height="90" rx="10" fill="#f0eafb" stroke="#8463a1"/><text x="165.0" y="415.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">FOM evaluates access</text><polygon points="165.0,510 290,555.0 165.0,600 40,555.0" fill="#fff5d6" stroke="#ab8227"/><text x="165.0" y="555.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Access granted?</text><rect x="40" y="650" width="250" height="90" rx="10" fill="#e8f5ed" stroke="#39815b"/><text x="165.0" y="685.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Door-control command</text><text x="165.0" y="705.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">For authorized door access</text><rect x="470" y="510" width="250" height="90" rx="10" fill="#fff5d6" stroke="#ab8227"/><text x="595.0" y="535.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">No authorized unlock</text><text x="595.0" y="555.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Display denial / missing</text><text x="595.0" y="575.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">certs</text><rect x="470" y="650" width="250" height="90" rx="10" fill="#e8f5ed" stroke="#39815b"/><text x="595.0" y="685.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Kiosk displays result</text><text x="595.0" y="705.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">via FOM HTTP GET</text><text x="30" y="775" font-family="Arial" font-size="13" fill="#536273">*Feedback and relay actions are logical outcomes; exact order, timing and request payload are not</text><text x="30" y="793" font-family="Arial" font-size="13" fill="#536273">supplied.</text></svg>