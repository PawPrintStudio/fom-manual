<svg xmlns="http://www.w3.org/2000/svg" width="760" height="823" viewBox="0 0 760 823"><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#546579"/></marker></defs><text x="30" y="32" font-family="Arial" font-size="22" font-weight="bold" fill="#172b45">Troubleshooting: kiosk display and updates</text><path d="M290,135.0 L470,135.0" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="380.0" y="128.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">No</text><path d="M165.0,180 L165.0,230" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="165.0" y="198.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">Yes</text><path d="M290,275.0 L470,275.0" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="380.0" y="268.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">No</text><path d="M165.0,320 L165.0,370" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="165.0" y="338.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">Yes</text><path d="M290,415.0 L470,415.0" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="380.0" y="408.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">No</text><path d="M165.0,460 L165.0,510" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="165.0" y="478.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">Yes</text><path d="M290,555.0 L470,555.0" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="380.0" y="548.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">No</text><path d="M165.0,600 L165.0,650" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="165.0" y="618.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">Yes</text><polygon points="165.0,90 290,135.0 165.0,180 40,135.0" fill="#fff5d6" stroke="#ab8227"/><text x="165.0" y="135.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Image visible?</text><rect x="470" y="90" width="250" height="90" rx="10" fill="#fff5d6" stroke="#ab8227"/><text x="595.0" y="125.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Check display supply / HDMI</text><text x="595.0" y="145.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Display USB also powers Pi</text><polygon points="165.0,230 290,275.0 165.0,320 40,275.0" fill="#fff5d6" stroke="#ab8227"/><text x="165.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Touch input works?</text><rect x="470" y="230" width="250" height="90" rx="10" fill="#fff5d6" stroke="#ab8227"/><text x="595.0" y="265.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Check touch USB connection</text><text x="595.0" y="285.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Separate from HDMI video</text><polygon points="165.0,370 290,415.0 165.0,460 40,415.0" fill="#fff5d6" stroke="#ab8227"/><text x="165.0" y="415.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Kiosk UI loads?</text><rect x="470" y="370" width="250" height="90" rx="10" fill="#fff5d6" stroke="#ab8227"/><text x="595.0" y="405.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Check Pi boot and UI startup</text><text x="595.0" y="425.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Service details: to confirm</text><polygon points="165.0,510 290,555.0 165.0,600 40,555.0" fill="#fff5d6" stroke="#ab8227"/><text x="165.0" y="555.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">UI updates after scan?</text><rect x="470" y="510" width="250" height="90" rx="10" fill="#fff5d6" stroke="#ab8227"/><text x="595.0" y="545.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Check EasyLog → FOM first</text><text x="595.0" y="565.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Then FOM GET → correct Pi</text><rect x="40" y="650" width="250" height="90" rx="10" fill="#e8f5ed" stroke="#39815b"/><text x="165.0" y="695.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Verify result and record fix</text><text x="30" y="775" font-family="Arial" font-size="13" fill="#536273">After corrective checks, retest. A working screen does not prove the HTTP receiver is healthy.</text></svg>