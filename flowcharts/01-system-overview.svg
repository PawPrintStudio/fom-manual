osk Raspberry Pis</text><text x="595.0" y="425.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">One per kiosk</text><rect x="470" y="510" width="250" height="90" rx="10" fill="#eaf2ff" stroke="#5077a8"/><text x="595.0" y="535.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Touchscreen UI</text><text x="595.0" y="555.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Authentication /</text><text x="595.0" y="575.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">certifications</text><text x="30" y="775" font-family="Arial" font-size="13" fill="#536273">Connections are logical paths; the server is reached over the network, not direct USB wiring.</text></svg>