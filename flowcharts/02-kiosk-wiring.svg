<svg xmlns="http://www.w3.org/2000/svg" width="760" height="701" viewBox="0 0 760 701"><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#546579"/></marker></defs><text x="30" y="32" font-family="Arial" font-size="22" font-weight="bold" fill="#172b45">Physical connections at each kiosk</text><path d="M165.0,180 L165.0,230" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="165.0" y="198.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">USB data</text><path d="M165.0,320 L165.0,370" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="165.0" y="338.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">Ethernet</text><path d="M165.0,460 L165.0,510" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="165.0" y="478.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">Ethernet</text><path d="M470,275.0 L290,275.0" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="380.0" y="268.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">Micro-USB power</text><path d="M290,527.0 L470,527.0" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="380.0" y="520.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">HDMI video</text><path d="M470,555.0 L290,555.0" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="380.0" y="548.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">USB touch</text><path d="M470,583.0 L290,583.0" fill="none" stroke="#546579" stroke-width="2" marker-end="url(#a)"/><text x="380.0" y="576.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#35465c" stroke="white" stroke-width="5" paint-order="stroke">USB power</text><rect x="40" y="90" width="250" height="90" rx="10" fill="#eaf2ff" stroke="#5077a8"/><text x="165.0" y="135.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">RFID scanner</text><rect x="40" y="230" width="250" height="90" rx="10" fill="#eaf2ff" stroke="#5077a8"/><text x="165.0" y="265.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">EasyLog box</text><text x="165.0" y="285.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Separate from the Pi</text><rect x="470" y="230" width="250" height="90" rx="10" fill="#eaf2ff" stroke="#5077a8"/><text x="595.0" y="265.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">EasyLog power brick</text><text x="595.0" y="285.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">5 V DC; micro-USB</text><rect x="40" y="370" width="250" height="90" rx="10" fill="#eaf2ff" stroke="#5077a8"/><text x="165.0" y="405.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">TXST EE network</text><text x="165.0" y="425.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">FOM server reachable here</text><rect x="40" y="510" width="250" height="90" rx="10" fill="#eaf2ff" stroke="#5077a8"/><text x="165.0" y="545.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Raspberry Pi</text><text x="165.0" y="565.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Ethernet; hosts kiosk UI</text><rect x="470" y="510" width="250" height="90" rx="10" fill="#eaf2ff" stroke="#5077a8"/><text x="595.0" y="545.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Touchscreen display</text><text x="595.0" y="565.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b45">Own supply: to confirm</text><text x="30" y="635" font-family="Arial" font-size="13" fill="#536273">HDMI: Pi to display. Touch USB: display to Pi input. USB power: display to Pi power input. These are</text><text x="30" y="653" font-family="Arial" font-size="13" fill="#536273">separate cable functions. EasyLog label: 5 V DC, 800 mA (unit 02660004).</text></svg>